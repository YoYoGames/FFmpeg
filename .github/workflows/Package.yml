name: Publish NuGet Package

on:
  workflow_dispatch:  # Now manual trigger, but no inputs

permissions:
  contents: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
  BUILD_CONFIGURATION: Release

jobs:
  publish:
    name: Publish NuGet
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Read version from RELEASE file
      id: version
      run: |
        BASE_VERSION=$(cat RELEASE | tr -d '\n')
        VERSION="${BASE_VERSION}.${{ github.run_number }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version: $VERSION"

    - name: Download FFmpeg release zip
      run: |
        echo "Downloading ffmpeg.zip from latest release..."
        gh release download --repo YoYoGames/FFmpeg --pattern "ffmpeg.zip" --dir ./
        unzip -q ffmpeg.zip -d ffmpeg

    - name: Restore NuGet packages
      run: dotnet restore ffmpeg.csproj        

    - name: Pack NuGet
      run: |
        echo "Packing the NuGet package with version: $VERSION..."
        dotnet pack ffmpeg.csproj --output ./nupkgs -p:Version=$VERSION -c Release --no-build
        echo "NuGet package created in ./nupkgs/"

    - name: Push NuGet to GitHub Packages
      run: |
        PACKAGE_PATH=$(find ./nupkgs -name "FFmpeg.Binaries.${VERSION}.nupkg")
        if [ -f "$PACKAGE_PATH" ]; then
          echo "Found package at $PACKAGE_PATH. Pushing..."
          dotnet nuget push "$PACKAGE_PATH" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${GH_TOKEN}" \
            --skip-duplicate || { echo "Failed to push package."; exit 1; }
          echo "Package published successfully."
        else
          echo "Error: NuGet package not found at expected path. Failing..."
          exit 1
        fi
